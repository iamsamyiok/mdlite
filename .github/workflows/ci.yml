name: CI
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 wine64

      - name: Build
        run: make
        working-directory: mdlite

      - name: Test (wine)
        run: |
          export WINEPREFIX=$HOME/.wineprefix WINEDEBUG=-all DISPLAY=
          make test
        working-directory: mdlite

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MDLite-win64
          path: mdlite/MDLite.exe
