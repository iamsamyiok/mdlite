name: CI
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 wine64

      - name: Build
        run: make
        working-directory: mdlite

      - name: Test (wine)
        run: |
          export WINEPREFIX=$HOME/.wineprefix WINEDEBUG=-all DISPLAY=
          make test
        working-directory: mdlite

      - name: Build debug (symbols for crash triage)
        working-directory: mdlite
        run: |
          x86_64-w64-mingw32-gcc -O0 -g -std=c99 -municode -DUNICODE -D_UNICODE main.c markdown.c             gitlite.c ai.c editlogic.c export.c zliblite.c tree.c graph.c             backlinks.c -o MDLite-dbg.exe $(echo -lgdi32 -lcomdlg32 -lshell32             -lshlwapi -luser32 -ladvapi32 -lwinhttp -lmsimg32 -lole32 -lwindowscodecs)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MDLite-win64
          path: mdlite/MDLite.exe

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: MDLite-win64-dbg
          path: mdlite/MDLite-dbg.exe
