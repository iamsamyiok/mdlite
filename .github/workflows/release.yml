name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 wine64

      - name: Build
        working-directory: mdlite
        run: make MDLite.exe

      - name: Test (wine)
        working-directory: mdlite
        run: |
          export WINEPREFIX=$HOME/.wineprefix WINEDEBUG=-all DISPLAY=
          make test

      - name: Checksum
        working-directory: mdlite
        run: sha256sum MDLite.exe > MDLite.exe.sha256

      - name: Create Release and upload exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release create "$REF_NAME" mdlite/MDLite.exe mdlite/MDLite.exe.sha256 --verify-tag --generate-notes --title "MDLite $REF_NAME" --notes "Windows x64 单文件版。校验和见 MDLite.exe.sha256。未签名 exe 可能被杀软误报，核对 SHA256 后选择仍要运行即可。"
